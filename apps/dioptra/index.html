<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dioptra</title>
    <link rel="icon" type="image/svg+xml" href="/icon-small.svg" />
    <script>
      // Paint the first frame in the right theme: the stored preference, else the system's.
      try {
        var pref = (JSON.parse(localStorage.getItem('dioptra-ui') || '{}').state || {}).theme || 'system';
        var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
