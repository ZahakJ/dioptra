name: release

on:
  push:
    tags: ["v*"]

# Read-only by default; each job asks for what it uses. Third-party actions
# are pinned to commit SHAs (version in the comment).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: write # tauri-action creates the release and uploads the bundles
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: --bundles appimage,deb,rpm
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: --bundles msi,nsis
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles dmg
    steps:
      - uses: actions/checkout@v4

      - name: Linux system packages
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.0
          targets: ${{ matrix.target }},wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: apps/dioptra/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: apps/dioptra
        run: pnpm install --frozen-lockfile

      - name: wasm-bindgen-cli
        shell: bash
        run: |
          if ! command -v wasm-bindgen >/dev/null || [[ "$(wasm-bindgen --version)" != "wasm-bindgen 0.2.129" ]]; then
            cargo install wasm-bindgen-cli --version 0.2.129 --locked
          fi

      - name: Build the wasm engine (the frontend bundle imports it)
        shell: bash
        run: ./scripts/build-wasm.sh

      - name: Build and upload bundles
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/dioptra
          tagName: ${{ github.ref_name }}
          releaseName: "Dioptra ${{ github.ref_name }}"
          releaseBody: "See the README for install lines per platform."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # Ad-hoc signature check (docs/macos-gatekeeper.md). Tauri signs the .app with
      # bundle.macOS.signingIdentity "-" before it builds the dmg, then deletes the loose .app
      # (only the dmg is requested), so this checks the .app inside the dmg users download and
      # fails the job if it is unsigned, partially signed or altered after signing.
      - name: Verify the macOS signature
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          dmg="$(find "target/${{ matrix.target }}/release/bundle/dmg" -maxdepth 1 -name '*.dmg' | head -1)"
          if [ -z "$dmg" ]; then echo "::error::no dmg was built"; exit 1; fi
          ./scripts/verify-macos-signature.sh "$dmg"

  # SHA256SUMS.txt for every asset of the release, for installation qualification
  # (docs/validation/iq-protocol.md). Runs after every platform job that finished, so a
  # partial release still carries the sums of what it holds.
  checksums:
    name: SHA256SUMS
    needs: desktop
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write # uploads SHA256SUMS.txt to the release
    steps:
      - name: Publish SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir assets
          cd assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*'
          rm -f SHA256SUMS.txt
          sha256sum -- * | LC_ALL=C sort -k2 > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt
          gh release upload "$TAG" ../SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
