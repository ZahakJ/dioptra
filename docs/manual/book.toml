[book]
title = "Dioptra manual"
description = "The Dioptra manual: entering data, formulas, t tests, ANOVA, curve fitting, survival analysis and publication graphs in a free GraphPad Prism alternative for Linux, Windows and macOS."
authors = ["The Dioptra contributors"]
language = "en"
src = "src"

[build]
create-missing = false

[output.html]
site-url = "/dioptra/manual/"
git-repository-url = "https://github.com/ZahakJ/dioptra"
edit-url-template = "https://github.com/ZahakJ/dioptra/edit/main/docs/manual/{path}"
default-theme = "light"
preferred-dark-theme = "navy"
no-section-label = false
additional-css = ["css/dioptra.css"]

[output.html.search]
enable = true
